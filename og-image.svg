<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#172554;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Glow effects -->
  <circle cx="1000" cy="100" r="400" fill="url(#glow1)"/>
  <circle cx="200" cy="500" r="300" fill="url(#glow2)"/>
  
  <!-- Text -->
  <text x="600" y="220" font-family="'Poppins', sans-serif" font-size="100" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="-1">MONTEREY PARK</text>
  
  <text x="600" y="390" font-family="'Poppins', sans-serif" font-size="140" font-weight="800" fill="#f59e0b" text-anchor="middle" filter="url(#shadow)" letter-spacing="8">HOA</text>
  
  <text x="600" y="470" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="rgba(255, 255, 255, 0.9)" text-anchor="middle" letter-spacing="1.5">YORK, SOUTH CAROLINA</text>
</svg>
