<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monterey Park HOA - OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
    }
    .og-image {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .og-image::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
      border-radius: 50%;
    }
    .og-image::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .text-container {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .monterey-park {
      font-size: 100px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      margin: 0;
      letter-spacing: -1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .hoa {
      font-size: 140px;
      font-weight: 800;
      color: #f59e0b;
      line-height: 1;
      margin: 20px 0 0 0;
      letter-spacing: 8px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .location {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin: 30px 0 0 0;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>
  <div class="og-image">
    <div class="text-container">
      <h1 class="monterey-park">MONTEREY PARK</h1>
      <h2 class="hoa">HOA</h2>
      <p class="location">YORK, SOUTH CAROLINA</p>
    </div>
  </div>
</body>
</html>
